name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, without cancelling an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Next.js
        run: npm run build-local
        env:
          STATIC_EXPORT: 'true'
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_APP_URL: ${{ steps.pages.outputs.base_url }}

      # GitHub Pages has no middleware, so serve the default locale (vi) at the root
      # to match next-intl's `as-needed` prefix: /scenarios -> vi, /en/scenarios -> en.
      - name: Serve default locale at root
        run: |
          cp -R out/vi/. out/
          cp out/vi.html out/index.html
          cp out/vi.txt out/index.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
